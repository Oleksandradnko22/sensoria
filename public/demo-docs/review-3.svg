<text x="64" y="150" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#2a2a2a">Я нарешті почала помічати</text><text x="64" y="184" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#2a2a2a">втому вчасно. Вихідні знову</text><text x="64" y="218" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#2a2a2a">вихідні, а не робота.</text><text x="64" y="252" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#2a2a2a">Це були важливі зміни</text><text x="64" y="286" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#2a2a2a">для мене. Дякую.</text>
<text x="320" y="436" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#888">ЗРАЗОК · ПРИКЛАД</text>
